# ----------------------------------------------------------------------------
# Security Scan Workflow
# This workflow runs security checks including dependency scanning and secrets detection.
# It runs on every push to develop and main branches.
# Runs on: ubuntu-latest
# ----------------------------------------------------------------------------

name: Security Scan

permissions:
  contents: read
  security-events: write
  actions: read
  
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    name: Security and Dependency Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 3: Install security scanning tools
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      # Step 4: Run pip-audit for dependency vulnerability scanning
      - name: Run dependency vulnerability scan
        run: pip-audit -r requirements.txt

      # Step 5: Run Bandit for static security analysis
      - name: Run Bandit for security issues
        run: bandit -r src/ -f json -o bandit-report.json

      # Step 6: Run Trivy for container and vulnerability scanning (optional)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # Step 7: Upload Trivy results to GitHub Security
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      # Step 8: Create security report
      - name: Create security report
        if: always()
        run: |
          echo "## 🔒 Security Scan Report" > security-report.md
          echo "- Safety: completed" >> security-report.md
          echo "- Bandit: completed" >> security-report.md
          echo "- Trivy: completed" >> security-report.md
