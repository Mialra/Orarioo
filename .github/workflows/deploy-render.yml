name: Deploy to Render

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Trigger deploy in Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_MAIN }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL_MAIN is not configured"
            exit 1
          fi

          curl --fail --show-error --silent "$DEPLOY_URL"
          echo "Render deploy triggered successfully"
