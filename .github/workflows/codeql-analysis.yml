# ----------------------------------------------------------------------------
# CodeQL Analysis Workflow
# This workflow performs advanced code analysis using GitHub's CodeQL.
# It detects and analyzes code patterns, security issues, and vulnerabilities.
# Runs on: ubuntu-latest
# Languages: Python
# Schedule: Weekly on Monday at 2 AM UTC + on push to main/develop
# ----------------------------------------------------------------------------

name: CodeQL Analysis

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/**'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Run CodeQL analysis weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Step 3: Set up Python for building
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Perform CodeQL analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
