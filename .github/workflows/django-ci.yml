# ----------------------------------------------------------------------------
# Django CI Workflow
# This workflow runs Django tests on every push to develop and main branches.
# It uses PostgreSQL for database testing and includes coverage reporting.
# Runs on: ubuntu-latest with Python 3.12
# ----------------------------------------------------------------------------

name: Django CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      DB_NAME: orarioo_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_SSLMODE: disable
    
    strategy:
      max-parallel: 3
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orarioo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # Step 4: Run Django migrations
      - name: Run migrations
        run: |
          python manage.py migrate --noinput
        working-directory: src

      # Step 5: Load test data
      - name: Load test data
        run: |
          python load_test_data.py
        working-directory: src

      # Step 6: Run tests with coverage
      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run --source='.' manage.py test
          coverage report --fail-under=70
        working-directory: src

      # Step 6: Upload coverage report to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
