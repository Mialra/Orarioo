# ----------------------------------------------------------------------------
# Commits Syntax Checker Workflow
# This workflow validates commit messages against the Conventional Commits spec.
# It runs on every push and pull request to ensure consistent commit history.
# Runs on: ubuntu-latest
# ----------------------------------------------------------------------------

name: Commits Syntax Checker

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  check:
    name: Conventional Commits Validator
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Validate commit messages using Conventional Commits action
      - name: Validate commit messages
        uses: webiny/action-conventional-commits@v1.3.0
