<section class="card border-0 shadow-sm admin-shell">
  {% include "main/tabs/_admin_tabs.html" %}
  <div class="card-body admin-shell-body">
    <div class="admin-section-header">
      <div>
        <h2 class="h4 fw-bold mb-1">{{ dashboard_admin_state.title }}</h2>
        <p class="admin-section-copy mb-0">{{ dashboard_admin_state.description }}</p>
      </div>
    </div>
    <div id="admin-users-alert"
         class="alert d-none mb-3"
         role="status"
         aria-live="polite"></div>
    <p id="admin-users-empty-message" class="d-none text-center">{{ dashboard_admin_state.empty_message }}</p>
    <div id="admin-users-list"
         class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 pt-1 admin-list-grid"
         aria-busy="false"
         aria-live="polite"></div>
    <div id="admin-users-pagination" class="mt-3"></div>
  </div>
</section>
