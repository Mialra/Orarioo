<section id="savedSection"
         class="dash-panel dash-generator-card"
         data-saved-list-url="{% url 'dashboard-saved' %}"
         data-saved-detail-url-template="{% url 'dashboard-saved-detail' timetable_name='__SAVED_NAME__' %}"
         data-open-saved-name="{{ dashboard_saved_timetable_name|default:''|escape }}">
    <div class="dash-panel-body schedule-flow">
        <div id="scheduleAlert" class="alert d-none" role="alert"></div>
        <section id="savedPickerSection" class="schedule-saved-picker">
            <div class="dash-panel-header">
                <div>
                    <h2 class="dash-panel-title">Horarios Guardados</h2>
                    <p class="dash-panel-copy">Selecciona un horario para verlo en detalle, filtrarlo y exportarlo.</p>
                </div>
            </div>
            <div id="savedScheduleCards"
                 class="row row-cols-1 row-cols-xl-2 g-3 saved-cards-grid">
                <div class="col">
                    <article class="saved-card-placeholder">
                        <p class="text-secondary mb-0">Cargando horarios guardados...</p>
                    </article>
                </div>
            </div>
        </section>
        <section id="savedWorkspaceSection" class="schedule-workspace d-none">
            <div class="schedule-workspace-head">
                <div class="schedule-workspace-brand">
                    <div class="schedule-workspace-brand-icon" aria-hidden="true">
                        <i data-lucide="folder-open" class="workspace-icon"></i>
                    </div>
                    <div>
                        <h3 id="savedWorkspaceTitle" class="schedule-workspace-title mb-1">Horario Guardado</h3>
                        <div class="schedule-workspace-meta">
                            <span id="savedWorkspaceStateBadge"
                                  class="schedule-pill schedule-pill-saved">Guardado</span>
                        </div>
                    </div>
                </div>
                <div class="row g-2 schedule-workspace-actions">
                    <div class="col-12 col-xl schedule-toolbar-filters">
                        <select id="savedWorkspaceCourseFilter"
                                class="form-select schedule-toolbar-select"
                                aria-label="Filtrar por curso">
                            <option value="">Todos los cursos</option>
                        </select>
                        <select id="savedWorkspaceTeacherFilter"
                                class="form-select schedule-toolbar-select"
                                aria-label="Filtrar por profesor">
                            <option value="">Todos los profesores</option>
                        </select>
                        <select id="savedWorkspaceSubjectFilter"
                                class="form-select schedule-toolbar-select"
                                aria-label="Filtrar por asignatura">
                            <option value="">Todas las asignaturas</option>
                        </select>
                    </div>
                    <div class="col-12 col-xl-auto schedule-toolbar-buttons">
                        <button type="button"
                                id="savedWorkspacePdfBtn"
                                class="btn btn-outline-secondary schedule-toolbar-btn">
                            <i data-lucide="download" class="btn-icon" aria-hidden="true"></i>
                            PDF
                        </button>
                        <button type="button"
                                id="savedWorkspaceCsvBtn"
                                class="btn btn-outline-secondary schedule-toolbar-btn">
                            <i data-lucide="download" class="btn-icon" aria-hidden="true"></i>
                            CSV
                        </button>
                        <button type="button"
                                id="savedWorkspaceBackBtn"
                                class="btn btn-outline-dark schedule-toolbar-btn">
                            <i data-lucide="arrow-left" class="btn-icon" aria-hidden="true"></i>
                            Volver
                        </button>
                    </div>
                </div>
            </div>
            <div id="savedWorkspaceOutput" class="schedule-board-shell"></div>
        </section>
    </div>
</section>
{% include "main/tabs/_schedule_export_modal.html" %}
