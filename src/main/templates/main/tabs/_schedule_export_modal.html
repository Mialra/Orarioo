<div class="modal fade"
     id="exportModal"
     tabindex="-1"
     aria-labelledby="exportModalTitle"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content schedule-modal-content schedule-export-modal-content">
            <div class="modal-header">
                <div>
                    <h5 id="exportModalTitle" class="modal-title mb-0">Exportar horario</h5>
                    <p id="exportContextText" class="text-secondary small mb-0 mt-1">
                        Se exportará la información que elijas. Selecciona el formato y las columnas opcionales que quieres incluir.
                    </p>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div id="export-modal-alert"
                     class="alert d-none mb-3"
                     role="alert"
                     aria-live="polite"></div>
                <div class="mb-3">
                    <div class="d-flex align-items-center gap-1 mb-1">
                        <label for="exportFormat" class="form-label fw-semibold mb-0">Formato</label>
                        <span class="text-danger" aria-hidden="true">*</span>
                    </div>
                    <select id="exportFormat" class="form-select">
                        <option value="csv">CSV</option>
                        <option value="pdf">PDF</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-1 mb-2">
                    <span class="fw-semibold">Información a exportar</span>
                    <span class="text-danger" aria-hidden="true">*</span>
                </div>
                <div class="row row-cols-1 row-cols-lg-3 g-2 mb-2 export-card-grid">
                    <div class="col d-grid">
                        <button type="button"
                                class="btn btn-outline-secondary export-entity-card"
                                data-export-entity="group"
                                data-export-select="exportGroupSelect"
                                aria-pressed="false">Todos los cursos</button>
                    </div>
                    <div class="col d-grid">
                        <button type="button"
                                class="btn btn-outline-secondary export-entity-card"
                                data-export-entity="teacher"
                                data-export-select="exportTeacherSelect"
                                aria-pressed="false">Todos los profesores</button>
                    </div>
                    <div class="col d-grid">
                        <button type="button"
                                class="btn btn-outline-secondary export-entity-card"
                                data-export-entity="classroom"
                                data-export-select="exportClassroomSelect"
                                aria-pressed="false">Todas las aulas</button>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-12 col-md-4">
                        <label class="form-label">Cursos concretos</label>
                        <div id="exportGroupSelect" class="checkbox-list"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Profesores concretos</label>
                        <div id="exportTeacherSelect" class="checkbox-list"></div>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Aulas concretas</label>
                        <div id="exportClassroomSelect" class="checkbox-list"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button"
                        id="cancelExportBtn"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="confirmExportBtn" class="btn btn-primary">Exportar</button>
            </div>
        </div>
    </div>
</div>
